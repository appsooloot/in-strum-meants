name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version && sw_vers && uname -m
      - name: Test
        timeout-minutes: 8
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report
        if: always()
        run: |
          {
            echo "FAILURES:"
            grep -E "error:|: error|failed \(|Test Case .*failed|Fatal|crashed|signal" test.log | grep -v "^\s*$" | head -n 40
            grep -E "Test Suite '(All|Selected) tests'|Executed [0-9]+ tests" test.log | tail -n 2
            if grep -q "unexpected signal" test.log; then echo "LAST LINES:"; grep -vE "^\[[0-9]+/[0-9]+\]" test.log | tail -n 30; fi
            swift --version 2>&1 | head -1
            grep -E "error:|warning: |Test Suite '(All|Selected) tests'|Test Case .*(failed|skipped)|Test Suite '[A-Za-z]+Tests' (passed|failed)|Executed [0-9]+ test|: error|failed \(|skipped|Compiling|Build complete" test.log | grep -v "^\s*$" | tail -n 160
          } > report.txt
          python3 -c "import sys,urllib.parse;t=open('report.txt').read()[-60000:];print('::notice title=test-report::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"

  previews:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/m3a' || github.ref == 'refs/heads/sets')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Render preview frames
        run: PREVIEW_DIR="$PWD/previews" DEMO_DIR="$PWD/previews/audio" swift test --filter "PreviewRenderTests|ShaderPreviewArtTests|DemoRenderTests" 2>&1 | tee preview.log; exit ${PIPESTATUS[0]}
      - name: Encode demo audio
        run: |
          for f in previews/audio/*.wav; do [ -f "$f" ] && afconvert -f m4af -d aac -b 256000 "$f" "${f%.wav}.m4a" && rm "$f"; done
          ls -la previews/audio || true
      - name: Render icon and installer art
        run: |
          brew install librsvg >/dev/null
          rsvg-convert -w 512 -h 512 Packaging/AppIcon.svg -o previews/app-icon.png
          rsvg-convert -w 1320 -h 800 Packaging/dmg-background.svg -o previews/dmg-background.png
      - name: Publish to previews branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la previews
          cd previews
          git init -q && git checkout -q -b previews
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "previews for $GITHUB_SHA"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previews
      - name: Report
        if: always()
        run: |
          grep -E "error:|warning: |passed|failed|skipped" preview.log | tail -n 40 > report.txt || true
          python3 -c "t=open('report.txt').read()[-60000:];print('::notice title=preview-report::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"

  package:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Packaging tools
        run: |
          brew install librsvg >/dev/null
          pip3 install --break-system-packages --quiet dmgbuild || pip3 install --quiet dmgbuild
      - name: Build app
        run: Scripts/make-app.sh "$GITHUB_RUN_NUMBER" 2>&1 | tee package.log; exit ${PIPESTATUS[0]}
      - name: Build installer
        run: Scripts/make-dmg.sh "$GITHUB_RUN_NUMBER" 2>&1 | tee -a package.log; exit ${PIPESTATUS[0]}
      - name: Check it is an Intel app for macOS 13+
        run: |
          BIN="dist/In Strum Meants.app/Contents/MacOS/InStrumMeants"
          ARCHS=$(lipo -archs "$BIN"); MINOS=$(vtool -show-build "$BIN" | awk '/minos/ {print $2}')
          echo "archs=$ARCHS minos=$MINOS" | tee -a package.log
          test "$ARCHS" = "x86_64"
          test "$MINOS" = "13.0"
          codesign --verify --verbose "dist/In Strum Meants.app" 2>&1 | tee -a package.log
      - name: Check the installer
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          check() { if eval "$2"; then echo "CHECK ok: $1" | tee -a package.log; else echo "CHECK FAILED: $1" | tee -a package.log; FAIL=1; fi; }
          FAIL=0
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/dmgcheck "$DMG" 2>&1 | tail -1 | sed 's/^/CHECK attach: /' | tee -a package.log
          echo "CHECK contents: $(ls -A /tmp/dmgcheck | tr '\n' ' ')" | tee -a package.log
          check "app present" 'test -d "/tmp/dmgcheck/In Strum Meants.app"'
          check "Applications link" 'test -L /tmp/dmgcheck/Applications && test "$(readlink /tmp/dmgcheck/Applications)" = "/Applications"'
          check "background" 'ls /tmp/dmgcheck/.background* >/dev/null 2>&1'
          check "app icon" 'test -f "/tmp/dmgcheck/In Strum Meants.app/Contents/Resources/AppIcon.icns"'
          hdiutil detach /tmp/dmgcheck >/dev/null || true
          test $FAIL = 0 && echo "dmg ok: $DMG" | tee -a package.log
          exit $FAIL
      - name: Render demo audio
        if: github.ref == 'refs/heads/main'
        run: |
          DEMO_DIR="$PWD/dist/demo" swift test --filter DemoRenderTests 2>&1 | tail -n 5
          for f in dist/demo/*.wav; do [ -f "$f" ] && afconvert -f m4af -d aac -b 256000 "$f" "${f%.wav}.m4a"; done
          ls -la dist/demo
      - name: Keep build
        uses: actions/upload-artifact@v4
        with:
          name: In-Strum-Meants-build-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.dmg
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **$(git log -1 --pretty=%s)**

          **Install:** download the **.dmg** below and open it, drag *In Strum Meants* onto *Applications* (choose **Replace** if asked), then right-click the app → **Open** → **Open** (first time only). The .zip is a fallback.

          **Hear the built-in instruments first:** the *-demo.m4a* files below are short original demos rendered on the build machine.

          **Ear checklist (built-in instruments):** goosebumps test · soft vs hard (softer = darker and rounder) · pedal ring and sympathetic shimmer · glass bloom swelling in after each note · **play-along test**: play along with the inspiring song in Spotify (Fine tune in the instrument window if it sounds sour) · presets feel distinct.

          **Check each build:** instant key response · soft vs hard feels right · pedal (optional) lingers · visuals land with notes · unplugging stops all sound · reopening restores your instrument.
          NOTES
          gh release create "build-$GITHUB_RUN_NUMBER" dist/*.dmg dist/*.zip dist/demo/*.m4a --title "In Strum Meants — build $GITHUB_RUN_NUMBER" --notes-file notes.md
      - name: Report
        if: always()
        run: |
          grep -E "error:|warning: |archs=|valid on disk|satisfies|Build complete|\.zip|dmg ok|\.dmg|CHECK" package.log | tail -n 40 > report.txt || true
          python3 -c "t=open('report.txt').read()[-60000:];print('::notice title=package-report::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
