name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version && sw_vers && uname -m
      - name: Test
        timeout-minutes: 8
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report
        if: always()
        run: |
          {
            echo "FAILED TESTS: $(grep -E "Test Case '.*' failed" test.log | sed -E "s/.*-\[[A-Za-z]+\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\].*/\1.\2/" | sort -u | tr '\n' ' ')"
            grep -E "Executed [0-9]+ tests" test.log | tail -n 1
            echo "FAILURES:"
            grep -E "error:|: error|Fatal|crashed|signal" test.log | grep -v "^\s*$" | sed -E 's,^/.*/(Tests|Sources)/,\1/,' | cut -c1-200 | head -n 40
            grep -E "Test Suite '(All|Selected) tests'|Executed [0-9]+ tests" test.log | tail -n 2
            if grep -q "unexpected signal" test.log; then echo "LAST LINES:"; grep -vE "^\[[0-9]+/[0-9]+\]" test.log | tail -n 30; fi
            swift --version 2>&1 | head -1
            grep -E "error:|warning: |Test Suite '(All|Selected) tests'|Test Case .*(failed|skipped)|Test Suite '[A-Za-z]+Tests' (passed|failed)|Executed [0-9]+ test|: error|failed \(|skipped|Compiling|Build complete" test.log | grep -v "^\s*$" | tail -n 160
          } > report.txt
          python3 -c "import sys,urllib.parse;t=open('report.txt').read()[-60000:];print('::notice title=test-report::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"

  previews:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/m3a' || github.ref == 'refs/heads/sets' || github.ref == 'refs/heads/sets-3-4' || github.ref == 'refs/heads/sets-5-6' || github.ref == 'refs/heads/sets-7-8' || github.ref == 'refs/heads/sets-9-10' || github.ref == 'refs/heads/sets-11-12')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Render preview frames
        run: PREVIEW_DIR="$PWD/previews" DEMO_DIR="$PWD/previews/audio" swift test --filter "PreviewRenderTests|ShaderPreviewArtTests|DemoRenderTests|SkyPreviewTests|WorldPreviewTests" 2>&1 | tee preview.log; exit ${PIPESTATUS[0]}
      - name: Encode demo audio
        run: |
          for f in previews/audio/*.wav; do [ -f "$f" ] && afconvert -f m4af -d aac -b 256000 "$f" "${f%.wav}.m4a" && rm "$f"; done
          ls -la previews/audio || true
      - name: Render icon and installer art
        run: |
          brew install librsvg >/dev/null
          rsvg-convert -w 512 -h 512 Packaging/AppIcon.svg -o previews/app-icon.png
          rsvg-convert -w 1320 -h 800 Packaging/dmg-background.svg -o previews/dmg-background.png
      - name: Publish to previews branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la previews
          cd previews
          git init -q && git checkout -q -b previews
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "previews for $GITHUB_SHA"
          # The push has hung on GitHub's side now and then: give each try two minutes, three tries.
          for i in 1 2 3; do
            perl -e 'alarm 120; exec @ARGV' git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previews && exit 0
            echo "push attempt $i failed or timed out"; sleep 10
          done
          exit 1
      - name: Report
        if: always()
        run: |
          grep -E "error:|warning: |passed|failed|skipped" preview.log | tail -n 40 > report.txt || true
          python3 -c "t=open('report.txt').read()[-60000:];print('::notice title=preview-report::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"

  package:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Packaging tools
        run: |
          brew install librsvg >/dev/null
          pip3 install --break-system-packages --quiet dmgbuild || pip3 install --quiet dmgbuild
      - name: Build app
        run: Scripts/make-app.sh "$GITHUB_RUN_NUMBER" 2>&1 | tee package.log; exit ${PIPESTATUS[0]}
      - name: Build installer
        run: Scripts/make-dmg.sh "$GITHUB_RUN_NUMBER" 2>&1 | tee -a package.log; exit ${PIPESTATUS[0]}
      - name: Check it is an Intel app for macOS 13+
        run: |
          BIN="dist/In Strum Meants.app/Contents/MacOS/InStrumMeants"
          ARCHS=$(lipo -archs "$BIN"); MINOS=$(vtool -show-build "$BIN" | awk '/minos/ {print $2}')
          echo "archs=$ARCHS minos=$MINOS" | tee -a package.log
          test "$ARCHS" = "x86_64"
          test "$MINOS" = "13.0"
          codesign --verify --verbose "dist/In Strum Meants.app" 2>&1 | tee -a package.log
      - name: Check the installer
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          check() { if eval "$2"; then echo "CHECK ok: $1" | tee -a package.log; else echo "CHECK FAILED: $1" | tee -a package.log; FAIL=1; fi; }
          FAIL=0
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/dmgcheck "$DMG" 2>&1 | tail -1 | sed 's/^/CHECK attach: /' | tee -a package.log
          echo "CHECK contents: $(ls -A /tmp/dmgcheck | tr '\n' ' ')" | tee -a package.log
          check "app present" 'test -d "/tmp/dmgcheck/In Strum Meants.app"'
          check "Applications link" 'test -L /tmp/dmgcheck/Applications && test "$(readlink /tmp/dmgcheck/Applications)" = "/Applications"'
          check "background" 'ls /tmp/dmgcheck/.background* >/dev/null 2>&1'
          check "app icon" 'test -f "/tmp/dmgcheck/In Strum Meants.app/Contents/Resources/AppIcon.icns"'
          hdiutil detach /tmp/dmgcheck >/dev/null || true
          test $FAIL = 0 && echo "dmg ok: $DMG" | tee -a package.log
          exit $FAIL
      - name: Render demo audio
        if: github.ref == 'refs/heads/main'
        run: |
          DEMO_DIR="$PWD/dist/demo" swift test --filter DemoRenderTests 2>&1 | tail -n 5
          for f in dist/demo/*.wav; do [ -f "$f" ] && afconvert -f m4af -d aac -b 256000 "$f" "${f%.wav}.m4a"; done
          ls -la dist/demo
      - name: Keep build
        uses: actions/upload-artifact@v4
        with:
          name: In-Strum-Meants-build-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.dmg
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **$(git log -1 --pretty=%s)**

          **Install:** download the **.dmg** below and open it, drag *In Strum Meants* onto *Applications* (choose **Replace** if asked), then right-click the app → **Open** → **Open** (first time only). The .zip is a fallback.

          **Preview build: Tea House Koto.** A new instrument to try before its world arrives: press **Choose Instrument** and pick **Tea House Koto** (presets: Tea House Koto, Winter Strings, Near the Bridge, Night Tea). Thirteen plucked strings in a small wooden room: bright near the bridge, gentler further off, with the open strings ringing softly along with what you play. It is born from its place, Tea House Snow, not from a song, so it has no "Inspired by" credit: its set will show a place card instead.

          **What to try:**
          - **Hirajōshi on E:** E, F, A, B, C and their octaves. Phrases that fall to a low E, with space between the notes, sound most like the instrument.
          - **Press with the pitch wheel (oshi):** pluck a note, then push the wheel up: the string glides up as far as a whole tone, and back down as you let go, without being plucked again.
          - **Yuri on pressure:** lean into a long note (aftertouch, if your keyboard sends it) for a slow, uneven vibrato that starts a moment after the pluck; **Yuri** sets how wide it goes.
          - **Pick** moves the plectrum from near the bridge (bright) to further off (gentle); **Silk** goes from a crisp modern string to soft silk; **Bloom** sets how much the open strings ring along.

          **Hear it first:** the *tea-house-koto-demo.m4a* below is a short original clip rendered on the build machine.

          **Preview build: Blue Depth.** A new instrument to try before its world arrives: press **Choose Instrument** and pick **Blue Depth** (presets: Blue Depth, Ghost Signal, Pressure Hull, Surface Light). The first instrument on a new analogue voice: a plucked synth that blinks the chord you hold on the sixteenths, through a murky dotted-eighth echo, with ghostly voices rising behind it and a big bass under the left hand. It is inspired by RÜFÜS DU SOL's "Underwater" (Solace, 2018), and its card is original art: sonar rings, bubbles and a dial, nothing taken from the record.

          **What to try:**
          - **Hold a chord and it blinks:** notes from C3 up step round in the order you pressed them, one each sixteenth, and the echo ripples off the grid. Let go and the echo rings on.
          - **The left hand plays a big bass:** notes below C3 are held, deep and never blinked; **Bass** sets how big.
          - **Press harder** (aftertouch, if your keyboard sends it) to open the filter and swell the ghostly voices; the pitch wheel bends everything two semitones.
          - **Murk** sinks the sound deeper under water, from clear to muffled; **Ghosts** brings the voices in; **Blink** goes from struck notes (0) to a light, quick blink.
          - **Tempo** sets the arp and the echo together (70 to 160 BPM).
          - **Play along with "Underwater"** in **F♯ minor** at **118** (the default Tempo): the blinking and the echo should lock to the record.

          **Hear it first:** the *blue-depth-demo.m4a* below is a short original clip rendered on the build machine.

          **Sets 7 & 8 — Night Skies: Aurora Fjord and Bioluminescent Bay.** Two new sets at the end of the gallery, each a world, a visual, an instrument and a soundscape that belong together.

          - **Aurora Fjord** (after Mac Miller's "Wings"; mood: awe-struck, cold, electric). A jetty at the head of a fjord, looking down it toward the pole: steep walls, still black water mirroring the aurora, a fishing village's lights and drifting ice. Instrument: **Polar Choir** (a breathy, glassy choir that swells while you hold; presets Polar Choir, Far Voices, Bowed Glass, Hush). Visual: **Curtain Lights**: every note sends a ripple through the aurora curtains where its key sits, held notes glow, and chords tint the curtains.
          - **Bioluminescent Bay** (after Lana Del Rey's "Happiness Is a Butterfly"; mood: magical, secret). A sheltered cove at night where the plankton glow: headlands with palms and mangroves, a still bay mirroring the stars, a moored boat's lantern and a lighthouse blinking on the far point. Instrument: **Plankton Keys** (a soft electric piano whose notes throw glassy sparks, in a slow tremolo haze; presets Plankton Keys, Glow Wake, Tide Tines, Midnight Bay). Visual: **Glow Wake**: notes light the water where their keys fall, and quick runs leave glowing wakes.
          - **New skies everywhere:** **the aurora**, by your city: australis in the south, borealis in the north, coming and going with the activity and your latitude. Each world gains an **Aurora** choice (Follow the sky, Always, Never), and Advanced an **Aurora** slider. **Real stars and constellations** from a 919-star catalogue (the Southern Cross over Melbourne), with an Advanced **Constellation lines** slider. Two new weathers: **Humid night** with fireflies, and **Diamond dust** with light pillars and glittering crystals. **Deep night** is a new Hold the light choice. The Gentle, Dramatic and Dreamy looks set the new sliders too.
          - **New sounds:** ice groans and cracks, a far waterfall, lapping water and a distant boat.

          **Hear them first:** polar-choir-demo, plankton-keys-demo, aurora-fjord-ambience and bioluminescent-bay-ambience are below (original clips rendered on the build machine; never the songs).

          **Ear-and-eye checklist:**
          - **Play-along test:** "Wings" in **A♭ major** at a half-time **60** on Polar Choir, and "Happiness Is a Butterfly" in **D major** at **68** on Plankton Keys. They should blend, never clash.
          - **The choir** swells while you hold and breathes; **Vowel** sweeps it from "oo" to "ee".
          - **The keys** bark when you dig in and scatter sparks.
          - **Curtain Lights:** notes ripple the aurora curtains and chords tint them.
          - **Glow Wake:** notes light the bay's water and runs leave wakes.
          - **The Southern Cross** in every night sky, and the Constellation lines slider (Advanced) brings the lines up and down.
          - **Fireflies** on a Humid night; **light pillars** in Diamond dust.
          - **The aurora from Melbourne** sits low in the south and, in Follow the sky, only shows in strong activity: set Aurora to **Always** in the fjord to see it any night.
          - **Smoothness** on Smooth (Display → Quality → Smooth).
          - **The two new cards** in the gallery breathe with their songs.

          **Builds 239+ — more:** new weathers **Snow flurries, Freezing drizzle, Squall, Thunderheads, Dust storm, Ice fog**; Advanced gains **Gentle / Dramatic / Dreamy** one-tap looks, **Reset Advanced**, **Calm random weather**, and sliders for wind, mist, halos, frost, rain, snow, gusts, clouds, stars, storm-flash rate, ground-drying time, rainbow brightness, and **moon and sun size** (try 2× moon for a supermoon). **Builds 237–238 — Advanced weather** (under the weather picker): how fast a picked weather arrives, how slowly random weather blends, spell length, how long the ground takes to dry, and rainbow brightness; plus new **Ice fog**, **Thunderheads** and **Dust storm** weathers. A picked weather now takes hold in 12 s (it was 60). **Build 235 — two more weathers:** **Hail** and **Smoke haze**. **Builds 231–234 — three more weathers:** **Fog bank** (thick white-out), **Sleet** (rain and snow together) and **Monsoon** (a hard, warm downpour), all under Sky → Weather and in random weather, in every world. **Build 230 — Rainbows and Sun-showers.** A new **Sun-shower** weather (sun through light rain) in Sky controls, and **rainbows** in every world's sky: a bright primary bow and a fainter reversed secondary opposite the sun, strongest in sun-showers and softer after the rain, only with the sun 1°–42° up (none in the snowy cabin). Birds sing up while a rainbow stands. Try Sky → Weather → Sun-shower with the sun low (morning or late afternoon).

          **Sets 5 & 6 — Cosy Windows: Snowbound Cabin Window and Bedroom Window at Dawn.** Two new sets in the gallery, each a world, a visual, an instrument and a soundscape that belong together.

          - **Snowbound Cabin Window** (after Mac Miller's "Stay"; mood: hushed, safe, warm). Inside a log cabin at a frosted three-by-two window: snowy alpine peaks that catch the alpenglow, pines, a far cabin whose window lights at dusk, a frozen creek, and the fire behind you lighting the frame, the sill, a candle and a mug. Instrument: **Cabin Felt** (felt upright with a horn that follows your top line). Visual: **Frost Grow**: hold notes and the frost creeps further over the glass; each note melts a warm clear patch where its key sits, which freezes back over when you let go; chords flare the fire. Rain falls as snow here, storms are blizzards.
          - **Bedroom Window at Dawn** (after Mac Miller's "Dunno"; mood: soft, waking). A painted sash window behind sheer curtains: rooftops and chimneys, houses lighting up as the morning comes, a street lamp, a big tree with the odd bird, a street that mirrors the lights after rain. Instrument: **Morning Box** (celesta or music box over a wall that builds). Visual: **Curtain Light**: holding notes swells the morning light, every note puffs air into the curtains at its key's place, high notes make dust motes glint, chords tint the light gold, rose or lilac, and at night notes twinkle the fairy lights. **Window open** (a setting) lets the curtains move more and the street come closer.
          - **New skies everywhere:** ice halos and sundogs on icy light-cloud days (moon halos at night), the pink Belt of Venus at twilight, pastel dawns about one morning in three, **Blizzard** and **After the rain** weathers (wet beaches and roads shine, drips fall). **Pastel dawn** is a new Hold the light choice.
          - **New sounds:** a fireplace, a kettle, a waking street, drips after rain and a ticking clock, heard through the glass in the window worlds (outdoor sounds lose their top indoors).

          **Hear them first:** cabin-felt-demo, morning-box-demo, snowbound-cabin-ambience and bedroom-dawn-ambience are below (original clips rendered on the build machine; never the songs).

          **Ear-and-eye checklist:**
          - **Play-along test:** "Stay" in **F♯ major** at its slow half-time pocket (about 67) on Cabin Felt, and "Dunno" in **C♯ major** at 82 on Morning Box. They should blend, never clash.
          - **The horn** follows your top line: legato slurs, fresh phrases scoop.
          - **The wall** builds the longer you play and settles when you stop.
          - **The fire and the kettle** sound right (crackle, roar; rumble, boil, click).
          - **Frost** grows while you hold notes and melts where you play.
          - **The curtains** breathe with the breeze and your notes.
          - **Halos, pastel dawns, blizzards and wet roads** show in the older worlds too.
          - **Smoothness** on Smooth (Display → Quality → Smooth).
          - **The two new cards** in the gallery move with their songs.

          **Sound & MIDI** (gear button, top right): pick the output, restart the audio, switch MIDI keyboards on or off, set the channel. If the sound cuts in and out, choose 512 or 1024 there and press Restart audio.

          **Check each build:** instant key response · soft vs hard feels right · pedal (optional) lingers · visuals land with notes · unplugging stops all sound · reopening restores your instrument and set.
          NOTES
          gh release create "build-$GITHUB_RUN_NUMBER" dist/*.dmg dist/*.zip dist/demo/*.m4a --title "In Strum Meants — build $GITHUB_RUN_NUMBER" --notes-file notes.md
      - name: Report
        if: always()
        run: |
          grep -E "error:|warning: |archs=|valid on disk|satisfies|Build complete|\.zip|dmg ok|\.dmg|CHECK" package.log | tail -n 40 > report.txt || true
          python3 -c "t=open('report.txt').read()[-60000:];print('::notice title=package-report::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
