<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f14"/>
      <stop offset="0.45" stop-color="#120d08"/>
      <stop offset="1" stop-color="#050403"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.48">
      <stop offset="0" stop-color="#ffb45a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff9a3c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="0.45" stop-color="#f2c568"/>
      <stop offset="1" stop-color="#b9821f"/>
    </linearGradient>
    <pattern id="keys" width="44" height="300" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
      <rect width="44" height="300" fill="#f4ecdc"/>
      <rect x="40" width="4" height="300" fill="#c9b99a"/>
      <rect x="30" width="18" height="170" rx="3" fill="#15100b"/>
    </pattern>
    <pattern id="keysLow" width="44" height="300" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
