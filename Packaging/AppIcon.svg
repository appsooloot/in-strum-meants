    <use href="#wing" transform="translate(1024 0) scale(-1 1)"/>
    <rect x="500" y="430" width="24" height="230" rx="12" fill="url(#gold)"/>
    <circle cx="512" cy="418" r="20" fill="url(#gold)"/>
    <path d="M 506 404 C 494 360, 470 320, 438 300" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 518 404 C 530 360, 554 320, 586 300" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="436" cy="298" r="10" fill="url(#gold)"/>
    <circle cx="588" cy="298" r="10" fill="url(#gold)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
